name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, platform 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SM=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then
            echo "sdkmanager not found (ANDROID_HOME=$SDK)"
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Clone llama.cpp
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          echo "llama.cpp $(git -C third_party/llama.cpp rev-parse --short HEAD)"

      - name: Build debug APK (native llama.cpp)
        run: |
          set +e
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            -PciAbi=arm64-v8a \
            -PllamaSrc="${GITHUB_WORKSPACE}/third_party/llama.cpp" \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            > "$RUNNER_TEMP/gradle-build.log" 2>&1
          EXIT=$?
          echo "===== gradle exit $EXIT ====="
          tail -n 80 "$RUNNER_TEMP/gradle-build.log"
          grep -E "error:|fatal error:|undefined reference" "$RUNNER_TEMP/gradle-build.log" | head -n 30 || true
          grep -E "error:|fatal error:" "$RUNNER_TEMP/gradle-build.log" | head -n 8 | while IFS= read -r line; do
            echo "::error::$line"
          done
          if [ "$EXIT" -ne 0 ]; then
            find app/.cxx app/build -name 'CMakeError.log' 2>/dev/null | while read -r f; do
              echo "----- $f -----"
              tail -n 40 "$f" || true
            done
          fi
          exit $EXIT

      - name: Locate APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            exit 1
          fi
          ls -lh "$APK"
          unzip -l "$APK" | grep -E '\.so$' || true
          cp "$APK" "AgentJiN-debug-${{ github.sha }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentJiN-debug-${{ github.sha }}
          path: AgentJiN-debug-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14
