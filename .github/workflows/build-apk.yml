name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      abi:
        description: "NDK ABI to package (phone APK = arm64-v8a)"
        required: false
        default: "arm64-v8a"

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, platform 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SM=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then
            echo "sdkmanager not found (ANDROID_HOME=$SDK)"
            ls -la "$SDK" || true
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          {
            echo "sdk.dir=$SDK"
            echo "ndk.dir=$SDK/ndk/27.2.12479018"
          } > local.properties
          echo "local.properties:" && cat local.properties
          ls -la "$SDK/ndk/27.2.12479018" | head

      - name: Toolchain check
        run: |
          command -v java
          java -version
          command -v gradle
          gradle -v
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Build debug APK (native llama.cpp + Kotlin)
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            -PciAbi="${ABI}" \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            | tee gradle-native.log

      - name: Dump native errors
        if: failure()
        run: |
          echo "===== last 300 lines of gradle log ====="
          tail -n 300 gradle-native.log || true
          echo "===== CMakeError / ninja logs ====="
          find app/.cxx app/build -type f \( -name 'CMakeError.log' -o -name 'CMakeOutput.log' -o -name '*.log' \) 2>/dev/null \
            | head -80 \
            | while read -r f; do
                echo "----- $f -----"
                tail -n 100 "$f" || true
              done

      - name: Upload native logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            gradle-native.log
            app/.cxx/**/CMakeError.log
            app/.cxx/**/CMakeOutput.log
            app/.cxx/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          cp "$APK" "AgentJiN-debug-${{ github.sha }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentJiN-debug-${{ github.sha }}
          path: AgentJiN-debug-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14
