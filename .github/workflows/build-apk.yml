name: Build APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SM=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then
            echo "sdkmanager not found (ANDROID_HOME=$SDK)"
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          set +e
          echo "which gradle: $(command -v gradle || true)"
          gradle -v
          gradle :app:assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            > "$RUNNER_TEMP/gradle-build.log" 2>&1
          EXIT=$?
          echo "===== gradle exit $EXIT ====="
          tail -n 80 "$RUNNER_TEMP/gradle-build.log"
          echo "===== compiler diagnostics ====="
          echo "===== ALL e: lines ====="
          grep -E "^e: " "$RUNNER_TEMP/gradle-build.log" || true
          # GitHub only keeps ~10 annotations per step; prefer storage/crypto files.
          {
            grep -E "^e: .*/core/storage/" "$RUNNER_TEMP/gradle-build.log" || true
            grep -E "^e: .*/core/crypto/" "$RUNNER_TEMP/gradle-build.log" || true
            grep -E "^e: " "$RUNNER_TEMP/gradle-build.log" || true
          } | awk 'NF && !seen[$0]++ { print; if (++n >= 8) exit }' | while IFS= read -r line; do
            echo "::error::$line"
          done
          if [ "$EXIT" -ne 0 ] && ! grep -q "^e: " "$RUNNER_TEMP/gradle-build.log"; then
            tail -n 25 "$RUNNER_TEMP/gradle-build.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $EXIT

      - name: Locate APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            find app/build/outputs -type f || true
            exit 1
          fi
          ls -lh "$APK"
          cp "$APK" "AgentJiN-debug-${{ github.sha }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentJiN-debug-${{ github.sha }}
          path: AgentJiN-debug-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14
